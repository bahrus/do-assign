<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative in sequence</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        class MoodStone extends HTMLElement{
            #isHappy;
            get isHappy(){
                return this.#isHappy;
            }
            set isHappy(nv){
                this.#isHappy = nv;
                this.querySelector('#happy').textContent = nv ? '😊' : '😢'
            }
            #age;
            get age(){
                return this.#age;
            }
            set age(nv){
                this.#age = nv;
                this.querySelector('#age').textContent = nv;
            }
            connectedCallback(){
                this.isHappy = true;
                this.age = 0;
            }
        }
        customElements.define('mood-stone', MoodStone);
    </script>
</head>
<body>
    <mood-stone itemscope>
        <div>
            Is Happy: <span id=happy></span>
            Age: <span id=age></span>
        </div>
        <button id=button>Do Assign Test</button>
    </mood-stone>
    <div id=target></div>
    <script type=module>
        import {defDoAssign} from '/def.js';
        await defDoAssign(document.body);
        // equivalent to <button do-assign='{"on": "click", "?.isHappy =!": ".", "?.age +=": 10}'>
        button.enh.set.doAssign.assignConfig = {
            on: 'click',
            '?.isHappy =!': '.',
            '?.age +=': 10,
        };

        setTimeout(() => {
            for(let i = 0; i < 1; i++) button.click();
            setTimeout(() => {
                const happy = document.querySelector('#happy').textContent;
                const age = document.querySelector('#age').textContent;
                if(happy === '😢' && age === '10') target.setAttribute('mark', 'good');
            }, 300);
        }, 1500);
    </script>
</body>
</html>
