<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative out of sequence</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        class MoodStone extends HTMLElement{
            #isHappy;
            get isHappy(){
                return this.#isHappy;
            }
            set isHappy(nv){
                this.#isHappy = nv;
                this.querySelector('#happy').textContent = nv ? '😊' : '😢'
            }
            #age;
            get age(){
                return this.#age;
            }
            set age(nv){
                this.#age = nv;
                this.querySelector('#age').textContent = nv;
            }
            connectedCallback(){
                this.isHappy = true;
                this.age = 0;
            }
        }
        customElements.define('mood-stone', MoodStone);
    </script>
</head>
<body>
    <mood-stone itemscope>
        <div>
            Is Happy: <span id=happy></span>
            Age: <span id=age></span>
        </div>
        <button id=button>Do Assign Test</button>
    </mood-stone>
    <script type=module>
        import {defDoAssign} from '/def.js';
        // set before the config is registered -- the spawn is deferred until defDoAssign runs.
        button.enh.set.doAssign.assignConfig = {
            on: 'click',
            '?.isHappy =!': '.',
            '?.age +=': 10,
        };
        await defDoAssign(document.body);
    </script>
</body>
</html>
